<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Country Explorer</title>
    <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-6">
        <header class="flex items-center justify-between py-6">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold tracking-wide text-zinc-200">
                <span class="grid size-7 place-items-center rounded-lg bg-zinc-900 ring-1 ring-white/10">CE</span>
                <span>Country Explorer</span>
            </a>
            <div class="text-xs text-zinc-400">Front-end prototype</div>
        </header>

        <section class="flex flex-1 flex-col items-center justify-center pb-20 text-center">
            <div class="w-full max-w-3xl">
                <h1 class="text-balance text-3xl font-semibold tracking-tight text-zinc-50 sm:text-5xl">
                    What country would you like to know about?
                </h1>
                <p class="mt-4 text-pretty text-sm text-zinc-400 sm:text-base">
                    Search a country to reveal its information!!
                </p>

                <form id="countrySearchForm" class="mt-10">
                    <label class="sr-only" for="countryQuery">Country</label>
                    <div class="flex items-stretch gap-2 rounded-2xl bg-zinc-900 p-2 ring-1 ring-white/10 shadow-[0_0_0_1px_rgba(255,255,255,0.06)]">
                        <input
                            id="countryQuery"
                            name="q"
                            autocomplete="off"
                            placeholder="e.g., Japan, Brazil, France…"
                            class="h-12 w-full rounded-xl bg-transparent px-4 text-sm text-zinc-100 placeholder:text-zinc-500 outline-none"
                        />
                        <button
                            type="submit"
                            class="h-12 shrink-0 rounded-xl bg-white px-5 text-sm font-semibold text-zinc-950 transition hover:bg-zinc-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60"
                        >
                            Search
                        </button>
                    </div>
                    <div id="searchHelp" class="mt-3 text-xs text-zinc-500">
                        Press Enter to search!
                </form>

                <div class="mt-8">
                    <div class="text-xs font-medium uppercase tracking-wider text-zinc-500">Try one</div>
                    <div class="mt-3 flex flex-wrap justify-center gap-2">
                        <button data-suggest="Japan" class="suggestion-chip rounded-full bg-zinc-900 px-4 py-2 text-sm text-zinc-200 ring-1 ring-white/10 transition hover:bg-zinc-800">Japan</button>
                        <button data-suggest="France" class="suggestion-chip rounded-full bg-zinc-900 px-4 py-2 text-sm text-zinc-200 ring-1 ring-white/10 transition hover:bg-zinc-800">France</button>
                        <button data-suggest="Brazil" class="suggestion-chip rounded-full bg-zinc-900 px-4 py-2 text-sm text-zinc-200 ring-1 ring-white/10 transition hover:bg-zinc-800">Brazil</button>
                        <button data-suggest="Kenya" class="suggestion-chip rounded-full bg-zinc-900 px-4 py-2 text-sm text-zinc-200 ring-1 ring-white/10 transition hover:bg-zinc-800">Kenya</button>
                        <button data-suggest="Australia" class="suggestion-chip rounded-full bg-zinc-900 px-4 py-2 text-sm text-zinc-200 ring-1 ring-white/10 transition hover:bg-zinc-800">Australia</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/landing.js" defer></script>
</body>
</html>
